<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習用の会員登録フォーム</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px 16px 360px; background: #f4f4f4; font-size: 16px; }
  .banner { background: #fff3cd; border: 2px solid #c99700; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
  th { width: 30%; background: #eee; font-size: 14px; }
  input[type=text], input[type=email], input[type=tel], input[type=password], select { font-size: 16px; padding: 6px; max-width: 100%; }
  .w-s { width: 4.5em; } .w-m { width: 7em; } .w-l { width: 95%; }
  button { margin-top: 16px; font-size: 18px; padding: 12px 24px; }
  /* アプリへ戻るボタン（大きく） */
  /* 狭い画面や文字を大きくしたときは、自動で縦に並びます */
  .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .nav a { flex: 1 1 9em; min-width: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; padding: 8px 10px;
    border-radius: 12px; border: 3px solid #b5541b; background: #fff; color: #8f3f10; font-size: 18px; font-weight: bold; text-decoration: none; line-height: 1.3; }
  .nav a.main { background: #b5541b; color: #fff; }
  #done { display: none; scroll-margin-top: 12px; margin-top: 20px; background: #e3f3e7; border: 3px solid #1f7a3a; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: bold; line-height: 1.6; }
  #done .nav { margin: 14px 0 0; }
  #done:focus { outline: 4px solid #1f7a3a; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="nav">
  <a class="main" href="/">← ホームへ</a>
  <a href="/register">← 登録の案内</a>
</div>
<div class="banner">これは練習用のページです（本物の登録ではありません）。ブックマークの「高島屋おてつだい」を押し、「自動入力」を選んで試してみましょう。</div>
<form id="practice-form">
<table>
<tr><th>メールアドレス</th><td><input type="email" name="email" class="w-l"></td></tr>
<tr><th>メールアドレス（確認用）</th><td><input type="email" name="email_confirm" class="w-l"></td></tr>
<tr><th>パスワード</th><td><input type="password" name="password" class="w-l" autocomplete="new-password"></td></tr>
<tr><th>パスワード（確認用）</th><td><input type="password" name="password_confirm" class="w-l" autocomplete="new-password"></td></tr>
<tr><th>お名前</th><td>姓 <input type="text" name="name_sei" class="w-m"> 名 <input type="text" name="name_mei" class="w-m"></td></tr>
<tr><th>フリガナ</th><td>セイ <input type="text" name="kana_sei" class="w-m"> メイ <input type="text" name="kana_mei" class="w-m"></td></tr>
<tr><th>郵便番号</th><td><input type="text" name="zip1" class="w-s" maxlength="3"> - <input type="text" name="zip2" class="w-s" maxlength="4"></td></tr>
<tr><th>都道府県</th><td><select name="pref"><option value="">選択してください</option><option value="11">埼玉県</option><option value="12">千葉県</option><option value="13">東京都</option><option value="01">北海道</option></select></td></tr>
<tr><th>市区町村</th><td><input type="text" name="address1" class="w-l"></td></tr>
<tr><th>町名・番地</th><td><input type="text" name="address2" class="w-l"></td></tr>
<tr><th>建物名・部屋番号</th><td><input type="text" name="address3" class="w-l"></td></tr>
<tr><th>電話番号</th><td><input type="tel" name="tel1" class="w-s"> - <input type="tel" name="tel2" class="w-s"> - <input type="tel" name="tel3" class="w-s"></td></tr>
<tr><th>性別</th><td><label><input type="radio" name="sex" value="1">男性</label> <label><input type="radio" name="sex" value="2">女性</label></td></tr>
<tr><th>生年月日</th><td>
  <select name="birth_y"><option value="">----</option><option>1959</option><option>1960</option><option>1961</option></select>年
  <select name="birth_m"><option value="">--</option><option value="03">03</option><option value="04">04</option><option value="05">05</option></select>月
  <select name="birth_d"><option value="">--</option><option value="01">01</option><option value="02">02</option></select>日
</td></tr>
<tr><th>メールマガジン</th><td><label><input type="radio" name="mailmag" value="1">希望する</label> <label><input type="radio" name="mailmag" value="0">希望しない</label></td></tr>
</table>
<button type="submit">確認画面へ（練習）</button>
</form>
<!-- 読み上げ機能で「おしまい」を知らせるための欄（いつもページにあり、文字を入れると読み上げられます） -->
<p id="done-live" class="sr-only" role="status" aria-live="polite"></p>
<div id="done" tabindex="-1">
  ✓ 練習はおしまいです。うまく入力できましたね！<br>
  （練習なので、どこにも送信していません。）
  <div class="nav">
    <a class="main" href="/">← ホームへ</a>
    <a href="/register">← 登録の案内</a>
  </div>
</div>
<script>
  document.getElementById("practice-form").addEventListener("submit", function (e) {
    e.preventDefault();
    /* 練習が終わったので、自動入力の案内を閉じます（「おしまい」の表示が隠れないように） */
    var helper = document.getElementById("kaiin-helper-host");
    if (helper) { helper.remove(); }
    document.querySelectorAll("[data-kaiin-mark]").forEach(function (el) { el.style.outline = ""; el.removeAttribute("data-kaiin-mark"); });
    var done = document.getElementById("done");
    done.style.display = "block";
    document.getElementById("done-live").textContent = "練習はおしまいです。うまく入力できましたね。練習なので、どこにも送信していません。";
    done.scrollIntoView({ behavior: "smooth", block: "start" });
    try { done.focus({ preventScroll: true }); } catch (err) { done.focus(); }
  });
</script>
</body>
</html>
